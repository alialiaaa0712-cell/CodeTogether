<h2>Topbar & Tab-bar 风格</h2>
<p class="subtitle">对比两种处理方式，选择你偏好的</p>

<div class="split">
  <!-- 左：当前风格微调 -->
  <div class="mockup">
    <div class="mockup-header">A — 现有风格优化</div>
    <div class="mockup-body" style="background: #eef2f7; padding: 0; overflow: hidden; border-radius: 0 0 8px 8px;">
      <!-- topbar -->
      <div style="background: rgba(246,249,253,0.92); backdrop-filter: blur(18px); padding: 10px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom: 1px solid rgba(103,123,154,0.12);">
        <span style="font-size:15px; font-weight:700; color:#162033; letter-spacing:-0.3px;">CodeTogether</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:11px; background:#dcfce7; color:#16a34a; padding:2px 8px; border-radius:20px; font-weight:500;">● 已连接</span>
          <span style="font-size:12px; color:#7d8797; cursor:pointer;">退出</span>
        </div>
      </div>
      <!-- 内容占位 -->
      <div style="padding: 14px; display:flex; flex-direction:column; gap:10px;">
        <div style="background: rgba(255,255,255,0.85); border-radius: 20px; padding: 14px; box-shadow: 0 8px 24px rgba(37,89,195,0.08);">
          <div style="font-size:11px; color:#5b6678; margin-bottom:6px;">概览</div>
          <div style="display:flex; gap:8px;">
            <div style="flex:1; text-align:center;">
              <div style="font-size:22px; font-weight:700; color:#2559c3;">2</div>
              <div style="font-size:10px; color:#7d8797;">活跃</div>
            </div>
            <div style="width:1px; background:rgba(103,123,154,0.15);"></div>
            <div style="flex:1; text-align:center;">
              <div style="font-size:22px; font-weight:700; color:#162033;">3</div>
              <div style="font-size:10px; color:#7d8797;">项目</div>
            </div>
          </div>
        </div>
        <div style="background: rgba(255,255,255,0.85); border-radius: 16px; padding: 12px; box-shadow: 0 4px 12px rgba(37,89,195,0.06);">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,#2559c3,#4a7ff0); flex-shrink:0;"></div>
            <div style="flex:1;">
              <div style="font-size:13px; font-weight:600; color:#162033;">search/CodeTogether</div>
              <div style="font-size:11px; color:#5b6678;">工具调用中</div>
            </div>
            <div style="width:8px; height:8px; border-radius:50%; background:#1f8a62; flex-shrink:0;"></div>
          </div>
        </div>
      </div>
      <!-- tab-bar -->
      <div style="background: rgba(244,247,251,0.96); backdrop-filter: blur(16px); padding: 8px 16px 12px; display:flex; border-top: 1px solid rgba(103,123,154,0.12); gap:4px;">
        <div style="flex:1; text-align:center; padding: 6px 0; font-size:12px; font-weight:600; color:#2559c3; background:rgba(37,89,195,0.1); border-radius:10px;">Agent</div>
        <div style="flex:1; text-align:center; padding: 6px 0; font-size:12px; color:#7d8797;">记忆</div>
        <div style="flex:1; text-align:center; padding: 6px 0; font-size:12px; color:#7d8797;">设置</div>
      </div>
    </div>
  </div>

  <!-- 右：更明显的tab指示 -->
  <div class="mockup">
    <div class="mockup-header">B — 强化 Tab 指示</div>
    <div class="mockup-body" style="background: #eef2f7; padding: 0; overflow: hidden; border-radius: 0 0 8px 8px;">

          <span style="font-size:12px; color:#7d8797; cursor:pointer;">退出</span>

      </div>

      <div style="padding: 14px; display:flex; flex-direction:column; gap:10px;">

          <div style="font-size:11px; color:#5b6678; margin-bottom:6px;">概览</div>
          <div style="display:flex; gap:8px;">
            <div style="flex:1; text-align:center;">
              <div style="font-size:22px; font-weight:700; color:#2559c3;">2</div>
              <div style="font-size:10px; color:#7d8797;">活跃</div>
            </div>
            <div style="width:1px; background:rgba(103,123,154,0.15);"></div>
            <div style="flex:1; text-align:center;">
              <div style="font-size:22px; font-weight:700; color:#162033;">3</div>
              <div style="font-size:10px; color:#7d8797;">项目</div>
            </div>
          </div>
        </div>
        <div style="background: rgba(255,255,255,0.85); border-radius: 16px; padding: 12px; box-shadow: 0 4px 12px rgba(37,89,195,0.06);">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,#2559c3,#4a7ff0); flex-shrink:0;"></div>
            <div style="flex:1;">
              <div style="font-size:13px; font-weight:600; color:#162033;">search/CodeTogether</div>
              <div style="font-size:11px; color:#5b6678;">工具调用中</div>
            </div>
            <div style="width:8px; height:8px; border-radius:50%; background:#1f8a62; flex-shrink:0;"></div>
          </div>
        </div>
      </div>
      <!-- tab-bar 强化版 -->
      <div style="background: rgba(244,247,251,0.96); backdrop-filter: blur(16px); padding: 4px 12px 12px; display:flex; border-top: 1px solid rgba(103,123,154,0.12); gap:0; position:relative;">
        <div style="flex:1; text-align:center; padding: 8px 0 4px; font-size:12px; font-weight:600; color:#2559c3; position:relative;">
          Agent
          <div style="position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:20px; height:3px; background:#2559c3; border-radius:2px;"></div>
        </div>
        <div style="flex:1; text-align:center; padding: 8px 0 4px; font-size:12px; color:#7d8797;">记忆</div>
        <div style="flex:1; text-align:center; padding: 8px 0 4px; font-size:12px; color:#7d8797;">设置</div>
      </div>
    </div>
  </div>
</div>
