<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="CodeTogether Mobile Web App">
  <title>CodeTogether</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=20260703q">
</head>
<body>
  <header class="topbar">
    <button id="back-btn" class="back-btn" type="button" style="display:none">←</button>
    <div id="topbar-main">
      <span class="topbar-title">CodeTogether</span>
      <span id="conn-status" class="conn-status disconnected">未连接</span>
      <button id="logout-btn" class="logout-btn" type="button" style="display:none">退出</button>
    </div>
  </header>

  <main class="page-shell">
    <!-- 状态页：按项目分类展示 agent 列表 -->
    <section id="view-agents" class="view active">
      <section class="hero-panel card card-hero">
        <div class="hero-copy">
          <h1 class="hero-title">CodeTogether</h1>
        </div>
        <div id="agent-overview" class="overview-grid" aria-live="polite"></div>
      </section>

      <section class="view-section-head compact-head">
        <div>
          <h2>Agent</h2>
        </div>
      </section>

      <div id="project-groups"></div>
    </section>

    <!-- 聊天页：点击 agent 后进入 -->
    <section id="view-chat" class="view">
      <div id="chat-agent-info" class="chat-agent-info"></div>
      <div id="chat-history" class="chat-history"></div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="3" placeholder="输入发给 Agent 的消息"></textarea>
        <button id="chat-send" type="submit">发送消息</button>
      </form>
    </section>

    <!-- 记忆页 -->
    <section id="view-memory" class="view">
      <section class="view-section-head compact-head compact-memory-head">
        <div>
          <h2>记忆</h2>
        </div>
      </section>
      <div class="card memory-board">
        <div class="memory-board-head">
          <div>
            <strong>审核台</strong>
          </div>
          <div style="display:flex;gap:8px">
            <button id="memory-select-mode-btn" class="secondary danger" type="button">删除</button>
            <button id="memory-filter-open" class="secondary filter-open-btn" type="button">筛选</button>
          </div>
        </div>
        <div id="memory-select-bar" class="memory-select-bar" hidden></div>
        <div id="memory-filter-summary" class="filter-summary" aria-live="polite"></div>
        <div class="memory-board-list">
          <div id="memory-list" class="memory-list"></div>
        </div>
      </div>
    </section>
    <!-- 设置页 -->
    <section id="view-settings" class="view">
      <section class="view-section-head compact-head">
        <div>
          <h2>设置</h2>
        </div>
      </section>
      <div class="card settings-card">
        <div id="settings-readonly-hint" class="settings-hint" style="display:none">仅 Admin 可修改配置</div>
        <label class="settings-label" for="settings-api-key">记忆提取 API Key</label>
        <input id="settings-api-key" class="settings-input" type="password" placeholder="留空使用服务端环境变量" autocomplete="off">
        <label class="settings-label" for="settings-base-url">Base URL</label>
        <input id="settings-base-url" class="settings-input" type="text" placeholder="https://...">
        <label class="settings-label" for="settings-model">模型名</label>
        <input id="settings-model" class="settings-input" type="text" placeholder="gpt-5.4">
        <button id="settings-save" class="settings-save" type="button" style="display:none">保存</button>
        <p id="settings-msg" class="settings-msg" style="display:none"></p>
      </div>
    </section>
  </main>

  <button id="chat-jump-latest" class="chat-jump-latest" type="button" hidden>有新消息，跳到最新</button>

  <div id="memory-filter-drawer" class="drawer" aria-hidden="true">
    <button id="memory-filter-backdrop" class="drawer-backdrop" type="button" aria-label="关闭筛选"></button>
    <section class="drawer-sheet" aria-label="记忆筛选面板">
      <div class="drawer-head">
        <strong>筛选记忆</strong>
        <button id="memory-filter-close" class="drawer-close secondary" type="button">完成</button>
      </div>

      <div class="drawer-group">
        <span class="drawer-label">排序</span>
        <div class="memory-sort-switch">
          <button id="memory-sort-time" class="pill active" type="button">最新</button>
          <button id="memory-sort-score" class="pill" type="button">评分</button>
          <button id="memory-sort-feedback" class="pill" type="button">反馈次数</button>
        </div>
      </div>

      <div class="drawer-group">
        <span class="drawer-label">范围</span>
        <div class="memory-scope-switch">
          <button id="memory-scope-current" class="pill active" type="button">当前项目</button>
          <button id="memory-scope-all" class="pill" type="button">全部项目</button>
        </div>
      </div>

      <div class="drawer-group">
        <span class="drawer-label">状态</span>
        <div class="memory-toolbar memory-filter-row">
          <button id="memory-filter-pending" class="pill active" type="button">待启用</button>
          <button id="memory-filter-review" class="pill" type="button">待晋升</button>
          <button id="memory-filter-active" class="pill" type="button">已启用</button>
        </div>
      </div>

      <div id="memory-tier-drawer-group" class="drawer-group" style="display:none">
        <span class="drawer-label">类型</span>
        <div id="memory-tier-filter" class="tier-filter"></div>
      </div>

      <div class="drawer-actions">
        <button id="memory-filter-reset" class="secondary" type="button">重置</button>
        <button id="memory-filter-apply" type="button">应用</button>
      </div>
    </section>
  </div>
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="agents" type="button">Agent</button>
    <button class="tab-btn" data-tab="memory" type="button">记忆</button>
    <button class="tab-btn" data-tab="settings" type="button">设置</button>
  </nav>

  <div id="login-overlay" class="login-overlay" style="display:none">
    <div class="login-card">
      <h1 class="login-title">CodeTogether</h1>
      <p class="login-desc">请输入 API Key 以继续</p>
      <input id="login-key-input" class="login-input" type="password" placeholder="ct-xxxxxxxx..." autocomplete="off">
      <p id="login-error" class="login-error" style="display:none"></p>
      <button id="login-submit" class="login-submit" type="button">确认</button>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js?v=20260703o"></script>
</body>
</html>
